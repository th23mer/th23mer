<svg xmlns="http://www.w3.org/2000/svg" width="900" height="356" viewBox="0 0 900 356" role="img" aria-labelledby="t" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="t">Delivery, end to end, schema to server, as a deploy log: schema (data model; PostgreSQL, SQL Server), api (REST and real-time; Express, Zod, JWT, Socket.io), ui (web, desktop, offline; React, Electron, PWA), ci (tests and builds; GitHub Actions, Vitest, Playwright), deploy (containers on a VPS; Docker, Nginx), then live in production.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15110E"/><stop offset="1" stop-color="#211913"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity="0.025"/></pattern>
</defs>
<style>
  .in { animation: rise .6s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bar { transform-origin: 0 0; animation: fill 2.90s linear backwards; }
  @keyframes fill { from { transform: scaleX(0); } }
</style>
