<svg xmlns="http://www.w3.org/2000/svg" width="900" height="92" viewBox="0 0 900 92" role="img" aria-labelledby="t" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<title id="t">Connection to github.com/th23mer closed. Thanks for reading.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15110E"/><stop offset="1" stop-color="#211913"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity="0.025"/></pattern>
</defs>
<style>
  .in { animation: rise .6s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

</style>
<rect width="900" height="92" rx="14" fill="url(#bg)"/>
<rect width="900" height="92" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="899" height="91" rx="13.5" fill="none" stroke="#4A3B2E"/>
<text x="24" y="38" fill="#9A8B7C" font-size="14">Connection to <tspan fill="#F5A524">github.com/th23mer</tspan> closed.</text>
<text x="24" y="66" font-size="14"><tspan fill="#8FD18B">~</tspan><tspan fill="#9A8B7C">$ </tspan><tspan fill="#F4EDE4"></tspan></text><rect x="49.2" y="54" width="8.4" height="16" fill="#F5A524" class="blink"/>
<text x="876" y="66" fill="#9A8B7C" font-size="13" text-anchor="end">thanks for reading</text>
</svg>
